<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>insidegubbio – Stato dei servizi</title>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #DFE5D7;
      --surface:   #EEF2E9;
      --text:      #0D120B;
      --muted:     #5A6056;
      --faint:     #8C9387;
      --border:    #A7ADA1;
      --green:     #1a7a4a;
      --green-bg:  rgba(26, 122, 74, .13);
      --amber:     #b07000;
      --amber-bg:  rgba(176, 112, 0, .13);
      --red:       #b03a24;
      --red-bg:    rgba(176, 58, 36, .13);
      --grey:      #888888;
      --grey-bg:   rgba(100, 100, 100, .12);
      --dim-bg:    rgba(100, 100, 100, .08);
      --dim:       #C2C8BC;
    }
    [data-theme="dark"] {
      --bg:      #0D120B;
      --surface: #171D15;
      --text:    #DFE5D7;
      --border:  #42493F;
    }
    body {
      font-family: 'Satoshi', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    nav {
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 0 40px;
      height: 52px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .site-name {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 17px;
      font-weight: 400;
    }
    .tab-btn {
      font-family: 'Satoshi', sans-serif;
      font-size: 13px;
      padding: 3px 12px;
      border-radius: 9999px;
      border: 1.5px solid transparent;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .tab-btn.active {
      border-color: var(--text);
      color: var(--text);
      font-weight: 600;
    }
    .theme-btn {
      margin-left: auto;
      font-family: 'Satoshi', sans-serif;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    .hero {
      text-align: center;
      margin-bottom: 40px;
    }
    .status-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      font-size: 22px;
      color: #fff;
    }
    h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 30px;
      font-weight: 400;
      margin-bottom: 6px;
    }
    .updated {
      font-size: 12px;
      color: var(--muted);
    }
    .services-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .services-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge.operational   { background: var(--green-bg); color: var(--green); }
    .badge.degraded      { background: var(--amber-bg); color: var(--amber); }
    .badge.downtime      { background: var(--red-bg);   color: var(--red);   }
    .badge.maintenance   { background: var(--grey-bg);  color: var(--grey);  }
    .badge.not_monitored { background: var(--dim-bg);   color: var(--faint); }
    .service-row {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
    }
    .service-row:last-child { border-bottom: none; }
    .service-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .service-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.operational   { background: var(--green); }
    .dot.degraded      { background: var(--amber); }
    .dot.downtime      { background: var(--red);   }
    .dot.maintenance   { background: var(--grey);  }
    .dot.not_monitored { background: var(--dim);   }
    .service-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .uptime-bar {
      display: flex;
      gap: 2px;
      margin: 8px 0 4px;
    }
    .day-bar {
      flex: 1;
      height: 28px;
      border-radius: 3px;
      min-width: 3px;
      cursor: default;
      transition: opacity .1s;
    }
    .day-bar:hover { opacity: .7; }
    .bar-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }
    .incidents-section h2 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 26px;
      font-weight: 400;
      margin-bottom: 28px;
    }
    .inc-group  { margin-bottom: 28px; }
    .inc-date {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .inc-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      margin-bottom: 10px;
    }
    .inc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .inc-title {
      font-size: 14px;
      font-weight: 600;
    }
    .inc-updates {
      margin-top: 8px;
      border-left: 2px solid var(--border);
      padding-left: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .inc-update { font-size: 13px; color: var(--muted); }
    .inc-update strong {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      text-transform: capitalize;
    }
    .inc-update time {
      font-size: 11px;
      margin-left: 6px;
      color: var(--faint);
    }
    .inc-update p { margin-top: 2px; line-height: 1.5; }
    .empty {
      padding: 48px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .loading {
      padding: 80px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    footer {
      text-align: center;
      padding: 24px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    footer a {
      color: inherit;
      text-decoration: underline;
    }
  </style>
</head>
<body>
<nav>
  <span class="site-name">insidegubbio</span>
  <button class="tab-btn active" id="tab-status"    onclick="setTab('status')">Stato</button>
  <button class="tab-btn"        id="tab-incidents" onclick="setTab('incidents')">Incidenti precedenti</button>
  <button class="theme-btn" onclick="toggleTheme()">☀ Tema</button>
</nav>
<main>
  
  <div id="status-view">
    <p class="loading" id="loading">Caricamento…</p>
    <div id="content" hidden>
      <div class="hero">
        <div class="status-icon" id="overall-icon"></div>
        <h1 id="overall-title"></h1>
        <p class="updated" id="updated-at"></p>
      </div>
      <div class="services-card">
        <div class="services-header">
          <span>Stato corrente dei servizi</span>
          <span class="badge" id="overall-badge"></span>
        </div>
        <div id="services-list"></div>
      </div>
    </div>
  </div>
  
  <div id="incidents-view" hidden>
    <section class="incidents-section">
      <h2>Incidenti precedenti</h2>
      <div id="incidents-list"></div>
    </section>
  </div>
</main>
<footer>
  Alimentato da <a href="https://betterstack.com">BetterStack</a>
</footer>
<script>
  const API_URL = 'https://betterstack.insidegubbio.com/it/index.json';
  const STATUS_COLOR = {
    operational:   '#1a7a4a',
    downtime:      '#b03a24',
    degraded:      '#b07000',
    maintenance:   '#888888',
    not_monitored: '#C2C8BC',
  };
  const STATUS_IT = {
    operational:   'Funzionante',
    downtime:      'Non funzionante',
    degraded:      'Degradato',
    maintenance:   'Manutenzione',
    not_monitored: 'Non monitorato',
  };
  const REPORT_TYPE_IT = {
    incident:    'Incidente',
    maintenance: 'Manutenzione',
  };
  let isDark = false;
  function toggleTheme() {
    isDark = !isDark;
    document.body.setAttribute('data-theme', isDark ? 'dark' : '');
    document.querySelector('.theme-btn').textContent = isDark ? '☾ Tema' : '☀ Tema';
  }
  function setTab(tab) {
    const isStatus = tab === 'status';
    document.getElementById('status-view').hidden    = !isStatus;
    document.getElementById('incidents-view').hidden =  isStatus;
    document.getElementById('tab-status').classList.toggle('active',    isStatus);
    document.getElementById('tab-incidents').classList.toggle('active', !isStatus);
  }
  const fmtDate = iso =>
    new Date(iso).toLocaleDateString('it-IT', { year: 'numeric', month: 'long', day: 'numeric' });
  const fmtDateTime = iso =>
    new Date(iso).toLocaleString('it-IT', {
      day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit',
    });
  function renderServices(resources) {
    const sorted = [...resources].sort((a, b) => a.attributes.position - b.attributes.position);
    document.getElementById('services-list').innerHTML = sorted.map(({ attributes: attr }) => {
      const pct  = attr.availability != null ? (attr.availability * 100).toFixed(3) : '—';
      const last90 = (attr.status_history || []).slice(-90);
      const bars = last90.map(d =>
        `<div class="day-bar"
              title="${d.day} — ${STATUS_IT[d.status] || d.status}"
              style="background:${STATUS_COLOR[d.status] || '#C2C8BC'}"></div>`
      ).join('');
      const note = attr.explanation
        ? `<span style="font-size:12px;color:var(--muted);font-style:italic;margin-left:4px">${attr.explanation}</span>`
        : '';
      return `
        <div class="service-row">
          <div class="service-top">
            <div class="service-name">
              <span class="dot ${attr.status}"></span>
              ${attr.public_name}${note}
            </div>
            <div class="service-meta">
              <span>${pct}% attivo</span>
              <span class="badge ${attr.status}">${STATUS_IT[attr.status] || attr.status}</span>
            </div>
          </div>
          <div class="uptime-bar">${bars}</div>
          <div class="bar-labels"><span>90 giorni fa</span><span>Oggi</span></div>
        </div>`;
    }).join('');
  }
  function renderIncidents(reports, updates) {
    const updatesById = Object.fromEntries(updates.map(u => [u.id, u]));
    const sorted = [...reports].sort(
      (a, b) => new Date(b.attributes.starts_at) - new Date(a.attributes.starts_at)
    );
    if (sorted.length === 0) {
      document.getElementById('incidents-list').innerHTML =
        '<p class="empty">Nessun incidente registrato.</p>';
      return;
    }
    const byDate = sorted.reduce((acc, r) => {
      const d = fmtDate(r.attributes.starts_at);
      (acc[d] = acc[d] || []).push(r);
      return acc;
    }, {});
    document.getElementById('incidents-list').innerHTML = Object.entries(byDate).map(([date, reps]) => {
      const cards = reps.map(r => {
        const attr       = r.attributes;
        const type       = REPORT_TYPE_IT[attr.report_type] || attr.report_type;
        const resolved   = attr.aggregate_state === 'resolved';
        const statusClass = resolved ? 'operational' : 'downtime';
        const statusLabel = resolved ? 'Risolto' : 'Aperto';
        const relUpdates = (r.relationships?.status_updates?.data || [])
          .map(ref => updatesById[ref.id])
          .filter(Boolean)
          .sort((a, b) => new Date(b.attributes.published_at) - new Date(a.attributes.published_at));
        const updatesHtml = relUpdates
          .filter(u => u.attributes.message !== 'Maintenance ended')
          .map(u => `
            <div class="inc-update">
              <strong>${type}</strong>
              <time>${fmtDateTime(u.attributes.published_at)}</time>
              <p>${u.attributes.message}</p>
            </div>`)
          .join('');
        return `
          <div class="inc-card">
            <div class="inc-header">
              <span class="inc-title">${attr.title}</span>
              <span class="badge ${statusClass}">${statusLabel}</span>
            </div>
            ${updatesHtml ? `<div class="inc-updates">${updatesHtml}</div>` : ''}
          </div>`;
      }).join('');
      return `<div class="inc-group"><p class="inc-date">${date}</p>${cards}</div>`;
    }).join('');
  }
  function renderOverall(state, updatedAt) {
    const icon  = document.getElementById('overall-icon');
    const title = document.getElementById('overall-title');
    const badge = document.getElementById('overall-badge');
    icon.style.background = STATUS_COLOR[state] || STATUS_COLOR.operational;
    const configs = {
      operational: { symbol: '✓', label: 'Tutti i servizi sono online',        badge: '✓ Funzionante'    },
      downtime:    { symbol: '✕', label: 'Interruzione del servizio in corso',  badge: '✕ Non funzionante' },
    };
    const cfg = configs[state] || { symbol: '⚠', label: 'Alcuni servizi hanno problemi', badge: '⚠ Degradato' };
    icon.textContent  = cfg.symbol;
    title.textContent = cfg.label;
    badge.textContent = cfg.badge;
    badge.className   = `badge ${state === 'operational' ? 'operational' : state === 'downtime' ? 'downtime' : 'degraded'}`;
    document.getElementById('updated-at').textContent =
      `Aggiornato l'ultima volta il ${fmtDateTime(updatedAt)}`;
  }
  async function load() {
    try {
      const res      = await fetch(API_URL);
      const json     = await res.json();
      const included = json.included || [];
      const resources = included.filter(i => i.type === 'status_page_resource');
      const reports   = included.filter(i => i.type === 'status_report');
      const updates   = included.filter(i => i.type === 'status_update');
      renderOverall(json.data.attributes.aggregate_state, json.data.attributes.updated_at);
      renderServices(resources);
      renderIncidents(reports, updates);
      document.getElementById('loading').remove();
      document.getElementById('content').hidden = false;
    } catch {
      document.getElementById('loading').textContent =
        'Errore nel caricamento dei dati. Riprova più tardi.';
    }
  }
  load();
</script>
</body>
</html>
